<!doctype html>
<html lang="{{ current_locale.replace('_', '-') }}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}{{ _('page_title') }}{% endblock %}</title>
    <style>
      /* ============================================
         CSS TOKENS
         ============================================ */
      :root {
        /* Colors */
        --color-primary: #1e3a8a;
        --color-primary-light: #3b82f6;
        --color-primary-dark: #1e40af;
        --color-secondary: #64748b;
        --color-secondary-light: #94a3b8;
        --color-success: #10b981;
        --color-error: #ef4444;
        --color-warning: #f59e0b;
        --color-info: #0ea5e9;

        /* Grays */
        --color-gray-50: #f9fafb;
        --color-gray-100: #f3f4f6;
        --color-gray-200: #e5e7eb;
        --color-gray-300: #d1d5db;
        --color-gray-400: #9ca3af;
        --color-gray-500: #6b7280;
        --color-gray-600: #4b5563;
        --color-gray-700: #374151;
        --color-gray-800: #1f2937;
        --color-gray-900: #111827;

        /* Typography */
        --font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        --font-size-xs: 0.75rem;
        --font-size-sm: 0.875rem;
        --font-size-base: 1rem;
        --font-size-lg: 1.125rem;
        --font-size-xl: 1.25rem;
        --font-size-2xl: 1.5rem;
        --font-weight-regular: 400;
        --font-weight-medium: 500;
        --font-weight-semibold: 600;
        --font-weight-bold: 700;

        /* Spacing */
        --space-xs: 0.25rem;
        --space-sm: 0.5rem;
        --space-md: 1rem;
        --space-lg: 1.5rem;
        --space-xl: 2rem;
        --space-2xl: 3rem;
        --space-3xl: 4rem;

        /* Shadows */
        --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        --shadow-base: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
        --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);

        /* Motion */
        --transition-fast: 150ms ease-out;
        --transition-base: 200ms ease-out;
        --transition-slow: 300ms ease-out;

        /* Border Radius */
        --radius-sm: 0.25rem;
        --radius-md: 0.375rem;
        --radius-lg: 0.5rem;
        --radius-full: 9999px;
      }

      /* ============================================
         RESET & BASE STYLES
         ============================================ */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
      }

      body {
        font-family: var(--font-family);
        font-size: var(--font-size-base);
        line-height: 1.5;
        color: var(--color-gray-900);
        background-color: var(--color-gray-50);
      }

      h1, h2, h3, h4, h5, h6 {
        margin: 0;
        font-weight: var(--font-weight-semibold);
      }

      p {
        margin: 0;
      }

      button {
        cursor: pointer;
        font-family: var(--font-family);
      }

      input, textarea, select {
        font-family: var(--font-family);
      }

      /* ============================================
         ACCESSIBILITY
         ============================================ */
      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        border: 0;
      }

      /* ============================================
         COMPONENTS: HEADER
         ============================================ */
      .app-header {
        background-color: var(--color-primary);
        color: white;
        padding: var(--space-lg);
        box-shadow: var(--shadow-md);
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: var(--space-lg);
      }

      .app-header-title {
        font-size: var(--font-size-2xl);
        font-weight: var(--font-weight-bold);
        color: white;
      }

      .app-header-right {
        display: flex;
        align-items: center;
        gap: var(--space-md);
      }

      .language-selector-form {
        margin: 0;
      }

      .language-selector {
        background-color: rgba(255, 255, 255, 0.2);
        border: 1px solid rgba(255, 255, 255, 0.3);
        color: white;
        padding: var(--space-sm) var(--space-md);
        border-radius: var(--radius-md);
        cursor: pointer;
        font-size: var(--font-size-sm);
        min-width: 120px;
        transition: background-color var(--transition-base);
      }

      .language-selector:hover {
        background-color: rgba(255, 255, 255, 0.3);
      }

      .language-selector:focus {
        outline: none;
        background-color: rgba(255, 255, 255, 0.3);
      }

      .language-selector option {
        color: var(--color-gray-900);
        background-color: white;
      }

      /* ============================================
         LAYOUT
         ============================================ */
      .app-main {
        flex: 1;
        padding: var(--space-lg);
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: var(--space-lg);
        background-color: white;
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-base);
      }

      /* ============================================
         COMPONENTS: BUTTONS
         ============================================ */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: var(--space-sm);
        padding: var(--space-md) var(--space-lg);
        font-size: var(--font-size-base);
        font-weight: var(--font-weight-medium);
        border: none;
        border-radius: var(--radius-md);
        transition: all var(--transition-base);
        white-space: nowrap;
        cursor: pointer;
      }

      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .btn-primary {
        background-color: var(--color-primary);
        color: white;
      }

      .btn-primary:hover:not(:disabled) {
        background-color: var(--color-primary-dark);
      }

      .btn-success {
        background-color: var(--color-success);
        color: white;
      }

      .btn-success:hover:not(:disabled) {
        background-color: #0f9e6f;
      }

      .btn-secondary {
        background-color: transparent;
        color: var(--color-secondary);
        border: 1px solid var(--color-secondary);
      }

      .btn-secondary:hover:not(:disabled) {
        background-color: var(--color-gray-100);
      }

      /* ============================================
         COMPONENTS: FORMS
         ============================================ */
      .field, .form-group {
        display: flex;
        flex-direction: column;
        gap: var(--space-sm);
        margin-bottom: var(--space-md);
      }

      .label, label {
        font-size: var(--font-size-sm);
        font-weight: var(--font-weight-medium);
        color: var(--color-gray-700);
      }

      .input, input[type="text"], input[type="email"], input[type="password"], textarea, select {
        padding: var(--space-md);
        font-size: var(--font-size-base);
        border: 1px solid var(--color-gray-300);
        border-radius: var(--radius-md);
        transition: border-color var(--transition-base);
        background-color: white;
        color: var(--color-gray-900);
      }

      .input:focus, input:focus, textarea:focus, select:focus {
        outline: none;
        border-color: var(--color-primary);
        box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.1);
      }

      .input:disabled, input:disabled, textarea:disabled, select:disabled {
        background-color: var(--color-gray-100);
        color: var(--color-gray-500);
        cursor: not-allowed;
      }

      .help-text {
        font-size: var(--font-size-sm);
        color: var(--color-gray-600);
        margin-top: calc(var(--space-xs) * -1);
      }

      /* Search form inline */
      .search-form-inline {
        display: flex;
        gap: var(--space-md);
        align-items: start;
        margin-bottom: var(--space-lg);
      }

      .search-form-inline .form-group {
        flex: 1;
        margin-bottom: 0;
        position: relative;
      }

      .search-form-inline .btn {
        flex-shrink: 0;
        margin-top: 28px; /* Altura aproximada del label (14px) + gap (8px) + ajuste (6px) */
      }

      .search-form-inline .help-text {
        position: absolute;
        bottom: -22px;
        left: 0;
        margin-top: 0;
      }

      .btn-icon {
        display: inline-flex;
        align-items: center;
        gap: var(--space-sm);
      }

      .btn-icon svg {
        width: 18px;
        height: 18px;
      }

      /* ============================================
         COMPONENTS: TABLE
         ============================================ */
      table {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: var(--space-lg);
      }

      thead {
        background-color: var(--color-gray-100);
        border-bottom: 2px solid var(--color-gray-300);
      }

      th {
        padding: var(--space-md);
        text-align: left;
        font-weight: var(--font-weight-semibold);
        color: var(--color-gray-700);
        font-size: var(--font-size-sm);
      }

      td {
        padding: var(--space-md);
        border-bottom: 1px solid var(--color-gray-200);
      }

      tbody tr:hover {
        background-color: var(--color-gray-50);
      }

      .checkbox-cell {
        width: 50px;
        text-align: center;
      }

      input[type="checkbox"] {
        cursor: pointer;
        width: 18px;
        height: 18px;
        accent-color: var(--color-primary);
      }

      /* ============================================
         COMPONENTS: ERROR/ALERT
         ============================================ */
      .error {
        background-color: #fee;
        border: 1px solid var(--color-error);
        border-radius: var(--radius-md);
        padding: var(--space-lg);
        margin-bottom: var(--space-lg);
        color: #991b1b;
      }

      /* ============================================
         UTILITIES
         ============================================ */
      .text-center {
        text-align: center;
      }

      .mb-md {
        margin-bottom: var(--space-md);
      }

      .mb-lg {
        margin-bottom: var(--space-lg);
      }

      .mt-md {
        margin-top: var(--space-md);
      }

      .mt-lg {
        margin-top: var(--space-lg);
      }

      .button-group {
        display: flex;
        gap: var(--space-md);
        flex-wrap: wrap;
      }

      .no-results {
        text-align: center;
        padding: var(--space-3xl);
        color: var(--color-gray-600);
      }

      /* ============================================
         PAGE SPECIFIC: ESTADOS
         ============================================ */
      .estado-badge {
        padding: 4px 8px;
        border-radius: var(--radius-sm);
        font-size: var(--font-size-xs);
        font-weight: var(--font-weight-semibold);
        text-transform: uppercase;
      }

      .estado-activo {
        background-color: #d4edda;
        color: #155724;
      }

      .estado-bloqueado {
        background-color: #fff3cd;
        color: #856404;
      }

      .estado-inactivo {
        background-color: #f8d7da;
        color: #721c24;
      }

      .estado-cerrado {
        background-color: #e2e3e5;
        color: #383d41;
      }

      .estado-desconocido {
        background-color: #d1ecf1;
        color: #0c5460;
      }

      /* ============================================
         RESPONSIVE
         ============================================ */
      @media (max-width: 768px) {
        .app-header {
          padding: var(--space-md) var(--space-lg);
        }

        .app-header-title {
          font-size: var(--font-size-xl);
          flex: 1 1 100%;
          margin-bottom: var(--space-sm);
        }

        .language-selector {
          min-width: 100px;
          font-size: var(--font-size-xs);
          padding: var(--space-sm) var(--space-md);
        }

        .container {
          padding: var(--space-md);
        }

        .button-group {
          flex-direction: column;
        }

        .btn {
          width: 100%;
        }

        table {
          font-size: var(--font-size-sm);
        }

        th, td {
          padding: var(--space-sm);
        }
      }

      {% block extra_styles %}{% endblock %}
    </style>
  </head>
  <body>
    {% include 'components/header.html' %}

    <div class="app-main">{% block content %}{% endblock %}</div>

    {% block extra_scripts %}{% endblock %}
  </body>
</html>
